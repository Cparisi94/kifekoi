name: Construire l'APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparer le projet Capacitor
        run: |
          mkdir -p app/www app/tools
          printf '<!doctype html><meta charset="utf-8"><title>Kifekoi</title>\n' > app/www/index.html
          cat > app/package.json <<'EOF'
          {
            "name": "kifekoi-app",
            "version": "1.1.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.2.0",
              "@capacitor/core": "^6.2.0",
              "@capacitor/local-notifications": "^6.1.0"
            },
            "devDependencies": {
              "@capacitor/assets": "^3.0.5",
              "@capacitor/cli": "^6.2.0"
            }
          }
          EOF
          cat > app/capacitor.config.json <<'EOF'
          {
            "appId": "fr.kifekoi.app",
            "appName": "Kifekoi",
            "webDir": "www",
            "android": {
              "allowMixedContent": false,
              "backgroundColor": "#0492c2"
            },
            "server": {
              "url": "https://cparisi94.github.io/kifekoi/",
              "androidScheme": "https",
              "cleartext": false
            }
          }
          EOF
          cat > app/patch-android.js <<'EOF'
          const fs = require('fs');
          const path = require('path');

          const appDir = __dirname;
          const androidMain = path.join(appDir, 'android', 'app', 'src', 'main');

          function patchStrings() {
            const file = path.join(androidMain, 'res', 'values', 'strings.xml');
            let xml = fs.readFileSync(file, 'utf8');
          xml = xml.replace(/<string name="app_name">.*?<\/string>/, '<string name="app_name">Kifékoï</string>');
          xml = xml.replace(/<string name="title_activity_main">.*?<\/string>/, '<string name="title_activity_main">Kifékoï</string>');
            fs.writeFileSync(file, xml);
          }

          function patchManifest() {
            const file = path.join(androidMain, 'AndroidManifest.xml');
            let xml = fs.readFileSync(file, 'utf8');
            const permissions = [
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.SCHEDULE_EXACT_ALARM',
              'android.permission.USE_EXACT_ALARM',
              'android.permission.RECEIVE_BOOT_COMPLETED',
              'android.permission.VIBRATE',
              'android.permission.WAKE_LOCK',
            ];
            for (const perm of permissions) {
              if (xml.includes(perm)) continue;
              xml = xml.replace('<application', '    <uses-permission android:name="' + perm + '" />\n\n    <application');
            }
            fs.writeFileSync(file, xml);
          }

          function patchGradle() {
            const file = path.join(appDir, 'android', 'app', 'build.gradle');
            let gradle = fs.readFileSync(file, 'utf8');
            if (gradle.includes('kifekoiSigning')) return;
            const signing = '    signingConfigs {\n' +
              '        kifekoiSigning {\n' +
              '            storeFile file("../../keystore.jks")\n' +
              '            storePassword "kifekoi2026"\n' +
              '            keyAlias "kifekoi"\n' +
              '            keyPassword "kifekoi2026"\n' +
              '            storeType "JKS"\n' +
              '        }\n' +
              '    }\n\n' +
              '    buildTypes {\n' +
              '        debug {\n' +
              '            signingConfig signingConfigs.kifekoiSigning\n' +
              '        }\n';
            gradle = gradle.replace('    buildTypes {', signing);
            fs.writeFileSync(file, gradle);
          }

          patchStrings();
          patchManifest();
          patchGradle();
          EOF
          base64 -d > app/keystore.jks <<'EOF'
          
          EOF

      - name: Installer les dependances
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Ajouter la plateforme Android
        working-directory: app
        run: npx cap add android

      - name: Personnaliser (nom, permissions, signature)
        working-directory: app
        run: node patch-android.js

      - name: Icones et ecran de demarrage
        working-directory: app
        run: |
          mkdir -p assets
          curl -fsSL https://cparisi94.github.io/kifekoi/icons/icon-1024.png -o assets/icon.png
          if command -v convert >/dev/null 2>&1; then
            convert assets/icon.png -resize 2732x2732! -background "#0492c2" -gravity center -extent 2732x2732 assets/splash.png
          else
            cp assets/icon.png assets/splash.png
          fi
          npx @capacitor/assets generate --android \
            --iconBackgroundColor "#0492c2" \
            --iconBackgroundColorDark "#0492c2" \
            --splashBackgroundColor "#0492c2" \
            --splashBackgroundColorDark "#0492c2"

      - name: Synchroniser
        working-directory: app
        run: npx cap sync android

      - name: Compiler l'APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk kifekoi.apk

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Kifekoi APK ${{ github.run_number }}
          make_latest: true
          files: kifekoi.apk
          body: |
            Application Android de Kifekoi.

            Installation : telecharger kifekoi.apk, l'ouvrir sur le telephone,
            autoriser l'installation, puis ouvrir Kifekoi et accepter les notifications.
