<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0492c2">
  <meta name="description" content="Kifékoi — agenda familial partagé : rendez-vous, rappels et infos pour toute la famille.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Kifékoi</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div id="splash" aria-hidden="true">
    <img src="icons/icon-192.png" alt="">
    <span>Kifékoi</span>
  </div>

  <div class="app">
    <main id="view"></main>

    <nav class="tabbar">
      <button type="button" data-action="nav" data-view="agenda"><span class="ico">🗓️</span>Agenda</button>
      <button type="button" data-action="nav" data-view="people"><span class="ico">👥</span>Personnes</button>
      <button type="button" data-action="nav" data-view="reminders"><span class="ico">🔔</span>Rappels</button>
      <button type="button" data-action="nav" data-view="bilan"><span class="ico">📊</span>Bilan</button>
      <button type="button" data-action="nav" data-view="settings">
        <span class="ico">⚙️</span>Réglages
        <span class="tab-dot off" id="tabSyncDot"></span>
      </button>
    </nav>
  </div>

  <div class="backdrop" id="backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>
<div class="tutorial" id="tutorial" hidden></div>

  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <noscript>
    <p style="padding:24px;text-align:center">Cette application a besoin de JavaScript pour fonctionner.</p>
  </noscript>

  <script>
    /* Ouverture directe du fichier (file://) : l'app a besoin d'un petit serveur. */
    if (location.protocol === 'file:') {
      document.addEventListener('DOMContentLoaded', function () {
        document.body.innerHTML =
          '<div style="max-width:560px;margin:12vh auto;padding:24px;font-family:system-ui,sans-serif;text-align:center;color:#0f1e33">' +
          '<h1 style="font-size:22px;margin:0 0 14px">Kifékoi</h1>' +
          '<p style="font-size:15px;line-height:1.6">Cette page ne fonctionne pas en double-cliquant sur le fichier.<br>' +
          'Double-cliquez plutôt sur <b>LANCER-LOCAL.cmd</b> : le navigateur s\'ouvrira tout seul sur la bonne adresse.</p>' +
          '<p style="font-size:13px;line-height:1.6;margin-top:16px;color:#64748b">Pour utiliser l\'application sur un téléphone, ' +
          'il faut la mettre en ligne (voir GUIDE-INSTALLATION.md, étape 3).</p>' +
          '</div>';
      });
    }
  </script>

  <script src="assets/native.js"></script>
  <script src="config.js"></script>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
