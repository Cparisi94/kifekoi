<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0492c2">
  <meta name="description" content="Kifékoi — agenda familial partagé : rendez-vous, rappels et infos pour toute la famille.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Kifékoi</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div id="splash" aria-hidden="true">
    <img src="icons/icon-192.png" alt="">
    <span>Kifékoi</span>
  </div>

  <div class="app">
    <main id="view"></main>

    <nav class="tabbar">
      <button type="button" data-action="nav" data-view="agenda">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>Agenda
      </button>
      <button type="button" data-action="nav" data-view="people">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M15 20c0-2.5 1.6-4 4-4"/></svg></span>Personnes
      </button>
      <button type="button" data-action="nav" data-view="reminders">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 16H6l1.5-2V10a4.5 4.5 0 019 0v4L18 16z"/><path d="M10 19a2 2 0 004 0"/></svg></span>Rappels
      </button>
      <button type="button" data-action="nav" data-view="bilan">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>Bilan
      </button>
      <button type="button" data-action="nav" data-view="settings">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></span>Réglages
        <span class="tab-dot off" id="tabSyncDot"></span>
      </button>
    </nav>
  </div>

  <div class="backdrop" id="backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>
<div class="tutorial" id="tutorial" hidden></div>

  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <noscript>
    <p style="padding:24px;text-align:center">Cette application a besoin de JavaScript pour fonctionner.</p>
  </noscript>

  <script>
    /* Ouverture directe du fichier (file://) : l'app a besoin d'un petit serveur. */
    if (location.protocol === 'file:') {
      document.addEventListener('DOMContentLoaded', function () {
        document.body.innerHTML =
          '<div style="max-width:560px;margin:12vh auto;padding:24px;font-family:system-ui,sans-serif;text-align:center;color:#0f1e33">' +
          '<h1 style="font-size:22px;margin:0 0 14px">Kifékoi</h1>' +
          '<p style="font-size:15px;line-height:1.6">Cette page ne fonctionne pas en double-cliquant sur le fichier.<br>' +
          'Double-cliquez plutôt sur <b>LANCER-LOCAL.cmd</b> : le navigateur s\'ouvrira tout seul sur la bonne adresse.</p>' +
          '<p style="font-size:13px;line-height:1.6;margin-top:16px;color:#64748b">Pour utiliser l\'application sur un téléphone, ' +
          'il faut la mettre en ligne (voir GUIDE-INSTALLATION.md, étape 3).</p>' +
          '</div>';
      });
    }
  </script>

  <script src="assets/native.js"></script>
  <script src="config.js"></script>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
